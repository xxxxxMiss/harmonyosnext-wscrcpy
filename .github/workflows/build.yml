name: build

on:
  workflow_dispatch:      # 手动触发（Actions 页面点 Run workflow）
  push:
    tags: ["v*"]

# 产物：
#   每次 build → Artifacts（含目录版 + 构建日志）
#   push tag  → GitHub Release 直接挂可执行文件：Wscrcpy-macOS.dmg / Wscrcpy-Windows.exe

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          brew install ffmpeg
      - name: 检查内置 hdc（需已提交 vendor/bin/hdc）
        run: |
          test -f vendor/bin/hdc || { echo "缺少 vendor/bin/hdc：从 DevEco Command Line Tools 取 macOS 版提交入库"; exit 1; }
      - name: Build
        env:
          HDC_BIN: vendor/bin/hdc
        run: |
          ./build.sh 2>&1 | tee build-mac.log
          exit ${PIPESTATUS[0]}
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos
          path: build-mac.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Wscrcpy-macOS
          path: |
            dist/Wscrcpy.app
            Wscrcpy-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: 检查内置 hdc（需已提交 vendor/bin/hdc.exe）
        shell: pwsh
        run: |
          if (-not (Test-Path vendor/bin/hdc.exe)) {
            Write-Error "缺少 vendor/bin/hdc.exe：从 DevEco Command Line Tools for Windows 取 hdc.exe 提交入库（ffmpeg 会自动下载）"
          }
      - name: Build
        shell: pwsh
        run: |
          ./build.ps1 2>&1 | Tee-Object -FilePath build-win.log
          exit $LASTEXITCODE
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: build-win.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Wscrcpy-Windows
          path: dist/Wscrcpy.exe

  # Release：tag 推送时创建，直接挂 dmg / exe 可执行文件
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wscrcpy-macOS
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: Wscrcpy-Windows
          path: rel
      - name: 整理发布文件
        run: |
          mkdir -p out
          mv rel/Wscrcpy-macOS.dmg out/ 2>/dev/null || true
          mv rel/Wscrcpy.exe out/ 2>/dev/null || true
          ls -lh out/
          test -f out/Wscrcpy-macOS.dmg && test -f out/Wscrcpy.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Wscrcpy-macOS.dmg
            out/Wscrcpy.exe
          generate_release_notes: true
